# Schreibwerkstatt – Beispiel-Dashboard
#
# Nur Bordmittel von Home Assistant (Sections-Ansicht, ab 2025.1), keine HACS-Karten.
# Einfügen: Einstellungen → Dashboards → Dashboard hinzufügen → „Neu von Grund auf“
#           → ⋮ → Raw-Konfigurationseditor → diesen Inhalt einfügen.
#
# Die Entity-IDs entstehen aus Gerätename + Sensorname bei deutscher HA-Sprache
# (englisch: sensor.schreibwerkstatt_ai_ai_cost_today usw.). Drei Stellen sind
# installationsabhängig und mit ANPASSEN markiert:
#   - Personen: hier „anna“ und „ben“ – je Benutzer-Gerät einen Abschnitt kopieren.
#     Ein Tagesziel-Sensor existiert nur, wenn die Person ein Tagesziel gesetzt hat.
#   - KI-Modelle: je Provider/Modell eigene Token- und Kostensensoren.
#   - Anthropic-Abrechnung: nur mit hinterlegtem Admin-Key auf dem Server.
#
# Statistik-Diagramme: Tageswerte mit Reset um Mitternacht als „Änderung“ (change),
# Momentanwerte wie „Wörter heute“ oder „Tagesziel“ als Tagesmaximum (max).

title: Schreibwerkstatt
views:
  # ───────────────────────────────────────────────────────────────── Heute ──
  - title: Heute
    path: heute
    icon: mdi:fountain-pen-tip
    type: sections
    max_columns: 4
    # Hinweis-Badges erscheinen nur, wenn etwas zu tun ist.
    badges:
      - type: entity
        entity: sensor.schreibwerkstatt_offene_registrierungen
        name: Registrierungen
        show_name: true
        color: orange
        tap_action: { action: url, url_path: /config/integrations/integration/schreibwerkstatt }
        visibility:
          - condition: numeric_state
            entity: sensor.schreibwerkstatt_offene_registrierungen
            above: 0
      - type: entity
        entity: sensor.schreibwerkstatt_jobs_beendete_jobs_24_h_error
        name: Fehlgeschlagene Jobs
        show_name: true
        color: red
        visibility:
          - condition: numeric_state
            entity: sensor.schreibwerkstatt_jobs_beendete_jobs_24_h_error
            above: 0
      - type: entity
        entity: sensor.schreibwerkstatt_js_fehler_24_h
        name: JS-Fehler
        show_name: true
        color: red
        visibility:
          - condition: numeric_state
            entity: sensor.schreibwerkstatt_js_fehler_24_h
            above: 0
      - type: entity
        entity: sensor.schreibwerkstatt_jobs_laufende_jobs
        name: Jobs laufen
        show_name: true
        color: blue
        visibility:
          - condition: numeric_state
            entity: sensor.schreibwerkstatt_jobs_laufende_jobs
            above: 0
    sections:
      # Die ganze Werkstatt heute
      - type: grid
        cards:
          - type: heading
            heading: Heute geschrieben
            icon: mdi:calendar-today
            badges:
              - type: entity
                entity: sensor.schreibwerkstatt_benutzer_aktive_benutzer_24_h
                icon: mdi:account-clock
                color: green
          - type: tile
            entity: sensor.schreibwerkstatt_schreiben_schreibzeit_heute
            name: Schreibzeit
            color: indigo
            grid_options: { columns: 12 }
          - type: tile
            entity: sensor.schreibwerkstatt_schreiben_worter_heute
            name: Wörter
            color: indigo
          - type: tile
            entity: sensor.schreibwerkstatt_schreiben_lektoratszeit_heute
            name: Lektorat
            color: purple
          - type: tile
            entity: sensor.schreibwerkstatt_schreiben_diktatzeit_heute
            name: Diktat
            color: teal
          - type: tile
            entity: sensor.schreibwerkstatt_schreiben_diktierte_zeichen_heute
            name: Diktierte Zeichen
            color: teal
          - type: statistics-graph
            title: Schreibzeit – 7 Tage
            entities:
              - entity: sensor.schreibwerkstatt_schreiben_schreibzeit_heute
                name: Schreibzeit
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types: [change]
            hide_legend: true

      # ANPASSEN: ein Abschnitt pro Person (Benutzer-Gerät)
      - type: grid
        cards:
          - type: heading
            heading: Anna
            icon: mdi:account-edit
            badges:
              - type: entity
                entity: sensor.anna_zuletzt_gesehen
                icon: mdi:account-clock
              - type: entity
                entity: binary_sensor.anna_tagesziel_erreicht
                show_state: false
                icon: mdi:trophy
                color: amber
                visibility:
                  - condition: state
                    entity: binary_sensor.anna_tagesziel_erreicht
                    state: "on"
          - type: gauge
            entity: sensor.anna_tagesziel
            name: Tagesziel
            min: 0
            max: 100
            needle: true
            segments:
              - { from: 0, color: "#e0e0e0" }
              - { from: 50, color: "#ffb74d" }
              - { from: 100, color: "#66bb6a" }
          - type: tile
            entity: sensor.anna_schreibzeit_heute
            name: Schreibzeit
            color: indigo
          - type: tile
            entity: sensor.anna_worter_heute
            name: Wörter heute
            color: indigo
          - type: tile
            entity: sensor.anna_lektoratszeit_heute
            name: Lektorat
            color: purple
          - type: tile
            entity: sensor.anna_diktatzeit_heute
            name: Diktat
            color: teal
          - type: tile
            entity: sensor.anna_ki_kosten_heute
            name: KI heute
            color: amber
          - type: tile
            entity: sensor.anna_ki_kosten_monat
            name: KI Monat
            color: amber
          - type: glance
            show_icon: false
            state_color: false
            entities:
              - entity: sensor.anna_bucher
                name: Bücher
              - entity: sensor.anna_worter
                name: Wörter
              - entity: sensor.anna_ki_kosten_gesamt
                name: KI gesamt

      - type: grid
        cards:
          - type: heading
            heading: Ben
            icon: mdi:account-edit
            badges:
              - type: entity
                entity: sensor.ben_zuletzt_gesehen
                icon: mdi:account-clock
          # Ben hat kein Tagesziel gesetzt → keine Tagesziel-Anzeige.
          - type: tile
            entity: sensor.ben_schreibzeit_heute
            name: Schreibzeit
            color: indigo
          - type: tile
            entity: sensor.ben_worter_heute
            name: Wörter heute
            color: indigo
          - type: tile
            entity: sensor.ben_lektoratszeit_heute
            name: Lektorat
            color: purple
          - type: tile
            entity: sensor.ben_diktatzeit_heute
            name: Diktat
            color: teal
          - type: tile
            entity: sensor.ben_ki_kosten_heute
            name: KI heute
            color: amber
          - type: tile
            entity: sensor.ben_ki_kosten_monat
            name: KI Monat
            color: amber
          - type: glance
            show_icon: false
            state_color: false
            entities:
              - entity: sensor.ben_bucher
                name: Bücher
              - entity: sensor.ben_worter
                name: Wörter
              - entity: sensor.ben_ki_kosten_gesamt
                name: KI gesamt

      # KI-Kosten auf einen Blick
      - type: grid
        cards:
          - type: heading
            heading: KI-Kosten
            icon: mdi:robot-outline
          - type: tile
            entity: sensor.schreibwerkstatt_ki_ki_kosten_heute
            name: Heute
            color: amber
          - type: tile
            entity: sensor.schreibwerkstatt_ki_ki_kosten_monat
            name: Dieser Monat
            color: amber
          # ANPASSEN: nur mit Anthropic-Admin-Key auf dem Server vorhanden, sonst entfernen.
          - type: tile
            entity: sensor.schreibwerkstatt_ki_anthropic_abrechnung_monat
            name: Anthropic abgerechnet
            icon: mdi:receipt-text
            color: deep-orange
            grid_options: { columns: 12 }
          - type: statistics-graph
            title: Kosten pro Tag – 30 Tage
            entities:
              - entity: sensor.schreibwerkstatt_ki_ki_kosten_heute
                name: KI-Kosten
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [change]
            hide_legend: true

  # ─────────────────────────────────────────────────────────────── Verlauf ──
  - title: Verlauf
    path: verlauf
    icon: mdi:chart-bar
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Schreiben
            icon: mdi:fountain-pen-tip
          - type: statistics-graph
            title: Schreib-, Lektorats- und Diktatzeit pro Tag
            entities:
              - entity: sensor.schreibwerkstatt_schreiben_schreibzeit_heute
                name: Schreiben
              - entity: sensor.schreibwerkstatt_schreiben_lektoratszeit_heute
                name: Lektorat
              - entity: sensor.schreibwerkstatt_schreiben_diktatzeit_heute
                name: Diktat
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [change]
            grid_options: { columns: 12 }
          - type: statistics-graph
            title: Netto-Wörter pro Tag
            entities:
              - entity: sensor.schreibwerkstatt_schreiben_worter_heute
                name: Wörter
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [max]
            hide_legend: true
          - type: statistics-graph
            title: Wörter im Bestand
            entities:
              - entity: sensor.schreibwerkstatt_inhalt_worter
                name: Wörter
            chart_type: line
            period: week
            days_to_show: 365
            stat_types: [max]
            hide_legend: true

      # ANPASSEN: Personen
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Pro Person
            icon: mdi:account-group
          - type: statistics-graph
            title: Schreibzeit pro Person
            entities:
              - entity: sensor.anna_schreibzeit_heute
                name: Anna
              - entity: sensor.ben_schreibzeit_heute
                name: Ben
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [change]
          - type: statistics-graph
            title: Tagesziel Anna (%)
            entities:
              - entity: sensor.anna_tagesziel
                name: Tagesziel
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [max]
            hide_legend: true
          - type: statistics-graph
            title: KI-Kosten pro Person
            entities:
              - entity: sensor.anna_ki_kosten_heute
                name: Anna
              - entity: sensor.ben_ki_kosten_heute
                name: Ben
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [change]
          - type: history-graph
            title: Tagesziel erreicht – 7 Tage
            hours_to_show: 168
            entities:
              - entity: binary_sensor.anna_tagesziel_erreicht
                name: Anna Tagesziel erreicht

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: KI
            icon: mdi:robot-outline
          - type: statistics-graph
            title: KI-Kosten pro Monat
            entities:
              - entity: sensor.schreibwerkstatt_ki_ki_kosten_monat
                name: Ledger
              # ANPASSEN: nur mit Anthropic-Admin-Key
              - entity: sensor.schreibwerkstatt_ki_anthropic_abrechnung_monat
                name: Anthropic
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types: [change]
          # ANPASSEN: ein Eintrag je Provider/Modell
          - type: statistics-graph
            title: Tokens pro Tag
            entities:
              - entity: sensor.schreibwerkstatt_ki_input_tokens_claude_sonnet_4_6_claude
                name: Input · Sonnet 4.6
              - entity: sensor.schreibwerkstatt_ki_output_tokens_claude_sonnet_4_6_claude
                name: Output · Sonnet 4.6
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types: [change]

  # ─────────────────────────────────────────────────── Bestand & Betrieb ──
  - title: Bestand & Betrieb
    path: betrieb
    icon: mdi:server
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bestand
            icon: mdi:bookshelf
          - type: tile
            entity: sensor.schreibwerkstatt_inhalt_bucher
            name: Bücher
            color: brown
          - type: tile
            entity: sensor.schreibwerkstatt_inhalt_kapitel
            name: Kapitel
            color: brown
          - type: tile
            entity: sensor.schreibwerkstatt_inhalt_seiten
            name: Seiten
            color: brown
          - type: tile
            entity: sensor.schreibwerkstatt_inhalt_normseiten
            name: Normseiten
            color: brown
          - type: tile
            entity: sensor.schreibwerkstatt_inhalt_worter
            name: Wörter
            color: indigo
          - type: tile
            entity: sensor.schreibwerkstatt_inhalt_zeichen
            name: Zeichen
            color: indigo

      - type: grid
        cards:
          - type: heading
            heading: Benutzer
            icon: mdi:account-multiple
          - type: tile
            entity: sensor.schreibwerkstatt_benutzer_aktive_benutzer_24_h
            name: Aktiv 24 h
            color: green
          - type: tile
            entity: sensor.schreibwerkstatt_benutzer_aktive_benutzer_7_tage
            name: Aktiv 7 Tage
            color: green
          - type: glance
            show_icon: false
            entities:
              - entity: sensor.schreibwerkstatt_benutzer_benutzer_active
                name: Aktiv
              - entity: sensor.schreibwerkstatt_benutzer_benutzer_invited
                name: Eingeladen
              - entity: sensor.schreibwerkstatt_benutzer_benutzer_suspended
                name: Gesperrt
              - entity: sensor.schreibwerkstatt_benutzer_benutzer_deleted
                name: Gelöscht
          - type: tile
            entity: sensor.schreibwerkstatt_offene_registrierungen
            name: Offene Registrierungen
            color: orange
            grid_options: { columns: 12 }

      - type: grid
        cards:
          - type: heading
            heading: Jobs
            icon: mdi:cog-play
          - type: tile
            entity: sensor.schreibwerkstatt_jobs_laufende_jobs
            name: Laufend
            color: blue
          - type: tile
            entity: sensor.schreibwerkstatt_jobs_wartende_jobs
            name: Wartend
            color: blue
          - type: glance
            title: Beendet in 24 h
            entities:
              - entity: sensor.schreibwerkstatt_jobs_beendete_jobs_24_h_done
                name: Erfolgreich
                icon: mdi:check-circle-outline
              - entity: sensor.schreibwerkstatt_jobs_beendete_jobs_24_h_error
                name: Fehler
                icon: mdi:alert-circle-outline
              - entity: sensor.schreibwerkstatt_jobs_beendete_jobs_24_h_cancelled
                name: Abgebrochen
                icon: mdi:cancel
          - type: history-graph
            title: Jobs – 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.schreibwerkstatt_jobs_laufende_jobs
                name: Laufend
              - entity: sensor.schreibwerkstatt_jobs_wartende_jobs
                name: Wartend

      - type: grid
        cards:
          - type: heading
            heading: Server
            icon: mdi:server
          - type: tile
            entity: sensor.schreibwerkstatt_datenbankgrosse
            name: Datenbank
            color: blue-grey
          - type: tile
            entity: sensor.schreibwerkstatt_js_fehler_24_h
            name: JS-Fehler 24 h
            color: red
          - type: statistics-graph
            title: Datenbankgrösse
            entities:
              - entity: sensor.schreibwerkstatt_datenbankgrosse
                name: Datenbank
            chart_type: line
            period: day
            days_to_show: 90
            stat_types: [max]
            hide_legend: true

      - type: grid
        cards:
          - type: heading
            heading: KI-Gesamtkosten
            icon: mdi:cash
          # ANPASSEN: ein Eintrag je Provider/Modell
          - type: entities
            state_color: false
            entities:
              - entity: sensor.schreibwerkstatt_ki_ki_kosten_gesamt_claude_sonnet_4_6_claude
                name: Claude Sonnet 4.6
              - type: divider
              - entity: sensor.schreibwerkstatt_ki_input_tokens_claude_sonnet_4_6_claude
                name: Input-Tokens
              - entity: sensor.schreibwerkstatt_ki_output_tokens_claude_sonnet_4_6_claude
                name: Output-Tokens

  # ────────────────────────────────────────────────────────────── Diagnose ──
  - title: Diagnose
    path: diagnose
    icon: mdi:stethoscope
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Prozess
            icon: mdi:memory
          - type: tile
            entity: sensor.schreibwerkstatt_laufzeit
            name: Laufzeit
            color: blue-grey
          - type: tile
            entity: sensor.schreibwerkstatt_schema_version
            name: Schema
            color: blue-grey
          - type: history-graph
            title: Speicher – 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.schreibwerkstatt_arbeitsspeicher
                name: Arbeitsspeicher
              - entity: sensor.schreibwerkstatt_heap_belegt
                name: Heap

      - type: grid
        cards:
          - type: heading
            heading: Block-Merge
            icon: mdi:source-merge
          - type: glance
            columns: 3
            entities:
              - entity: sensor.schreibwerkstatt_block_merge_stille_merges
                name: Still
              - entity: sensor.schreibwerkstatt_block_merge_merge_konflikte_angezeigt
                name: Konflikte
              - entity: sensor.schreibwerkstatt_block_merge_merge_uberschreibungen
                name: Überschrieben
          - type: glance
            title: Konflikte gelöst
            columns: 3
            entities:
              - entity: sensor.schreibwerkstatt_block_merge_merge_konflikte_gelost_local
                name: Lokal
              - entity: sensor.schreibwerkstatt_block_merge_merge_konflikte_gelost_remote
                name: Server
              - entity: sensor.schreibwerkstatt_block_merge_merge_konflikte_gelost_both
                name: Beide

      - type: grid
        cards:
          - type: heading
            heading: Abrechnung & Details
            icon: mdi:receipt-text
          # ANPASSEN: nur mit Anthropic-Admin-Key
          - type: tile
            entity: sensor.schreibwerkstatt_ki_abweichung_abrechnung
            name: Abweichung Anthropic ↔ Ledger
            icon: mdi:scale-unbalanced
            color: deep-orange
            grid_options: { columns: 12 }
          - type: markdown
            content: >-
              **Weitere Aufschlüsselungen** sind standardmässig deaktiviert
              (viele Label-Kombinationen): Kosten nach Job-Typ, Cache-Tokens,
              Job-Historie je Typ, Jobs im Speicher, Geräte je Client-Version.
              Aktivieren unter *Einstellungen → Geräte & Dienste →
              Schreibwerkstatt → Entitäten*, dann hier ergänzen – z. B.
              `sensor.schreibwerkstatt_ki_ki_kosten_nach_typ_job_lektorat`.
