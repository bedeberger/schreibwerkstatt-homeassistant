# Schreibwerkstatt – Dashboard
#
# Einstellungen → Dashboards → Dashboard hinzufügen → „Neu von Grund auf“
# → ⋮ → Raw-Konfigurationseditor → diesen Inhalt einfügen.
#
# Die Integration baut das Dashboard selbst aus den vorhandenen Entitäten:
# vorne die Zeichen (heute, im Bestand, pro Buch und Person, Tempo), unter
# „Personen“ ein Abschnitt pro Person, die in den letzten 14 Tagen da war (die
# übrigen kompakt in einer Liste), Tagesziel und KI-Kacheln nur, wo es sie braucht, und
# in den Tagesdiagrammen nur die KI-Modelle der letzten 30 Tage – ohne Entity-IDs
# von Hand anzupassen. Neue Personen und Modelle erscheinen beim nächsten Laden
# des Dashboards.
#
# Wer selbst gestalten will: ⋮ → „Kontrolle übernehmen“ wandelt das Ergebnis
# in normales, editierbares YAML mit den echten Entity-IDs um.

strategy:
  type: custom:schreibwerkstatt
  # Nur bei mehreren Schreibwerkstatt-Servern: welcher (Eintrags-ID aus der URL
  # unter Einstellungen → Geräte & Dienste → Schreibwerkstatt).
  # entry_id: 01J…
  # title: Schreibwerkstatt
